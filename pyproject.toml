[project]
name = "vmware-mcp"
version = "0.4.0"
description = "MCP server for VMware Workstation Pro"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
markers = [
    "integration: 需要真实 VMware Workstation 环境（默认跳过，设 VMWARE_IT=1 启用）",
]

[project.scripts]
vmware-mcp = "vmware_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
